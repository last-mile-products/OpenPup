# Deploy the static site to Firebase Hosting.
# Keyless auth: GitHub's OIDC token is exchanged for a short-lived Google
# access token through Workload Identity Federation. No JSON keys and no
# firebase login:ci refresh tokens are stored in the repo or in Actions secrets.

name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One Hosting release at a time. A newer push cancels an in-progress run so
# two deploys never upload together, and the latest commit is the one that
# publishes.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # contents: read is enough to check out the repo.
    # id-token: write lets google-github-actions/auth request an OIDC token
    # for Workload Identity Federation.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json has no engines field and the repo has no .nvmrc.
      # README requires Node.js 20+, so the workflow pins 20.
      # cache: npm stores the npm cache keyed from package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next.config.ts sets output: "export", so this writes the static site
      # to out/. firebase.json already publishes that directory.
      - name: Build static export
        run: npm run build

      # token_format: access_token makes this step impersonate the service
      # account (STS, then the IAM Credentials API). A permissions or API
      # problem fails here with Google's error instead of a later generic
      # "firebase login" message.
      # create_credentials_file still writes the external_account ADC file.
      # firebase-tools does not use that file: its auto-auth path ignores
      # external_account credentials and then reports "have you run firebase
      # login?". The deploy step therefore passes the impersonated access
      # token. That value is minted in this job; it is not a stored secret.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/157224892820/locations/global/workloadIdentityPools/github/providers/openpup-repo
          service_account: openpup-github-deployer@openpup.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      # FIREBASE_TOKEN is how firebase-tools accepts a CI token. Here it is
      # steps.auth.outputs.access_token, a short-lived impersonated access
      # token. The CLI tries to refresh it, gets HTTP 400, and then uses the
      # same string as the bearer token (firebase-tools src/auth.ts).
      # --debug prints the underlying auth error if that still fails.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: npx firebase-tools@latest deploy --only hosting --project openpup --non-interactive --debug
